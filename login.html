<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Login — ARCANE Community</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="assets/logo.png" />

  <style>
    /* Style login — inline biar aman */
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .login-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1E9BE0 0%, #0F1115 100%);
      padding: 20px;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .login-wrapper {
      width: 100%;
      max-width: 400px;
    }

    .login-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 40px 32px 28px;
      box-shadow: 0 30px 80px rgba(0,0,0,.3);
      text-align: center;
    }

    .login-logo {
      width: 68px;
      height: 68px;
      object-fit: contain;
      margin: 0 auto 14px;
      display: block;
      border-radius: 12px;
    }

    .login-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 0 0 6px;
      color: #0A0A0A;
    }

    .login-subtitle {
      color: #6B7280;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-group > i:first-child,
    .input-group > svg:first-child {
      position: absolute;
      left: 15px;
      color: #6B7280;
      font-size: 17px;
      pointer-events: none;
      width: 17px;
      height: 17px;
    }

    .input-group input {
      width: 100%;
      padding: 13px 44px 13px 44px;
      border: 1.5px solid #E8E8E8;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14.5px;
      background: #FFFFFF;
      color: #0A0A0A;
      transition: .2s;
      box-sizing: border-box;
    }

    .input-group input:focus {
      outline: none;
      border-color: #1E9BE0;
      box-shadow: 0 0 0 3px rgba(30,155,224,.15);
    }

    .toggle-pass {
      position: absolute;
      right: 11px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6B7280;
      border-radius: 8px;
      transition: .2s;
      background: none;
      border: none;
      cursor: pointer;
    }

    .toggle-pass:hover { color: #1E9BE0; }
    .toggle-pass svg { width: 17px; height: 17px; }

    .login-error {
      color: #E04B1E;
      font-size: 13px;
      min-height: 18px;
      text-align: left;
      padding-left: 4px;
    }

    .login-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
      padding: 12px 24px;
      background: #1E9BE0;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: .2s;
      font-family: inherit;
      box-shadow: 0 6px 20px rgba(30,155,224,.3);
    }

    .login-btn:hover {
      background: #157BB5;
      transform: translateY(-2px);
    }

    .login-btn:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .login-btn svg { width: 18px; height: 18px; }

    .login-footer {
      margin-top: 26px;
      font-size: 12.5px;
      color: #6B7280;
    }
  </style>
</head>
<body class="login-body">

  <div class="login-wrapper">
    <div class="login-card">
      <img src="assets/logo.png" alt="ARCANE" class="login-logo" onerror="this.style.display='none'" />
      <h1 class="login-title">ARCANE</h1>
      <p class="login-subtitle">Masuk untuk melanjutkan</p>

      <form id="loginForm" class="login-form">
        <div class="input-group">
          <i data-lucide="mail"></i>
          <input type="email" id="email" placeholder="Email" required autocomplete="email" />
        </div>
        <div class="input-group">
          <i data-lucide="lock"></i>
          <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
            <i data-lucide="eye" id="eyeIcon"></i>
          </button>
        </div>

        <div class="login-error" id="loginError"></div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span id="loginBtnText">Masuk</span>
          <i data-lucide="log-in"></i>
        </button>
      </form>

      <p class="login-footer">Informasi. Kreativitas. Komunitas.</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { firebaseConfig } from "./js/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isLoggingIn = false;

    // Init Lucide
    window.addEventListener('load', function() {
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });

    // Kalau udah login → redirect (tapi tunggu dulu, jangan loop)
    onAuthStateChanged(auth, async (user) => {
      // Kalau lagi proses login → skip
      if (isLoggingIn) {
        console.log('[Login] Sedang login — skip redirect');
        return;
      }

      if (user) {
        try {
          const userDoc = await getDoc(doc(db, 'users', user.uid));
          if (userDoc.exists()) {
            const data = userDoc.data();
            if (data.username) {
              console.log('[Login] User udah login — redirect');
              window.location.href = 'index.html';
            }
          }
        } catch (e) {
          console.log('[Login] Error cek user:', e);
        }
      }
    });

    // Toggle password
    const togglePass = document.getElementById('togglePass');
    const passInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    togglePass?.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
      if (eyeIcon) {
        eyeIcon.setAttribute('data-lucide', isPass ? 'eye-off' : 'eye');
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }
    });

    // Login form
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('loginBtnText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      btn.disabled = true;
      btnText.textContent = 'Memproses...';
      isLoggingIn = true;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const userDoc = await getDoc(doc(db, 'users', cred.user.uid));

        if (!userDoc.exists()) {
          await signOut(auth);
          throw new Error('Akun belum di-setup admin. Hubungi ArcZeyn.');
        }

        const data = userDoc.data();
        if (!data.username) {
          await signOut(auth);
          throw new Error('Username belum di-setup admin. Hubungi ArcZeyn.');
        }

        console.log('[Login] Sukses — redirect ke index.html');
        window.location.href = 'index.html';
      } catch (err) {
        console.error(err);
        isLoggingIn = false;
        let msg = 'Email atau password salah.';
        if (err.code === 'auth/too-many-requests') msg = 'Terlalu banyak percobaan. Coba lagi nanti.';
        if (err.code === 'auth/invalid-email') msg = 'Format email tidak valid.';
        if (err.message && !err.code) msg = err.message;
        errorEl.textContent = msg;
        btn.disabled = false;
        btnText.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
