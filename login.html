<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Login — ARCANE Community</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
</head>
<body class="login-body">

  <div class="login-wrapper">
    <div class="login-card">
      <img src="assets/logo.png" alt="ARCANE" class="login-logo" onerror="this.style.display='none'" />
      <h1 class="login-title" data-i18n="login.title">ARCANE</h1>
      <p class="login-subtitle" data-i18n="login.subtitle">Masuk untuk melanjutkan</p>

      <form id="loginForm" class="login-form" novalidate>
        <div class="input-group">
          <i data-lucide="mail"></i>
          <input type="email" id="email" placeholder="Email" required autocomplete="email" data-i18n-ph="login.email" />
        </div>
        <div class="input-group">
          <i data-lucide="lock"></i>
          <input type="password" id="password" placeholder="Password" required autocomplete="current-password" data-i18n-ph="login.password" />
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Toggle password">
            <i data-lucide="eye" id="eyeIcon"></i>
          </button>
        </div>

        <div class="login-error" id="loginError"></div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span id="loginBtnText" data-i18n="login.btn">Masuk</span>
          <i data-lucide="log-in"></i>
        </button>
      </form>

      <p class="login-footer" data-i18n="login.footer">Informasi. Kreativitas. Komunitas.</p>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>

</body>
</html>
